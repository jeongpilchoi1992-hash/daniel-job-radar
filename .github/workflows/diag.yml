name: Diagnostics (temporary)

on:
  push:
    branches: [claude/job-radar-v1]
    paths:
      - scripts/diag.py

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/diag.py

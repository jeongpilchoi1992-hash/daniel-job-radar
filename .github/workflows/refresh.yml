name: Refresh jobs and deploy

on:
  schedule:
    # 6:15 AM and 6:15 PM Eastern (EDT). Free public sources only.
    - cron: "15 10,22 * * *"
  push:
    # The claude/job-radar-v1 entry is temporary: it lets the launch build run before merging.
    branches: [main, claude/job-radar-v1]
    paths-ignore:
      - "data/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Start from the branch head, not the triggering commit, so a queued run sees the previous run's data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect jobs
        env:
          PYTHONUNBUFFERED: "1"
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          # Temporary, for the launch build: a commit tagged [export-ai-input] also writes data/ai_input.json.
          EXPORT_AI_INPUT: ${{ github.ref == 'refs/heads/claude/job-radar-v1' && contains(github.event.head_commit.message, '[export-ai-input]') }}
        run: python scripts/collect.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Refresh job data"
          # If another commit landed meanwhile, replay this refresh on top; its data is the newest.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1

      - name: Prepare site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    needs: refresh
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Refresh jobs and deploy

on:
  schedule:
    # 6:15 AM and 6:15 PM Eastern (EDT). Free public sources only.
    - cron: "15 10,22 * * *"
  push:
    # The claude/job-radar-v1 entry is temporary: it lets the launch build run before merging.
    branches: [main, claude/job-radar-v1]
    paths-ignore:
      - "data/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect jobs
        env:
          PYTHONUNBUFFERED: "1"
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          # One-time launch build only: a commit tagged [ai-build] writes the AI briefs and searches.
          # This block is removed right after that run, so later refreshes never use AI credit.
          RUN_AI: ${{ contains(github.event.head_commit.message, '[ai-build]') }}
          ANTHROPIC_API_KEY: ${{ contains(github.event.head_commit.message, '[ai-build]') && secrets.ANTHROPIC_API_KEY || '' }}
        run: python scripts/collect.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh job data"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Prepare site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    needs: refresh
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
